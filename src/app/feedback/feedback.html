<main>
  <h1>say something (anonymous)</h1>
  <p class="text-sm text-gray-400">
    honest feedback is really important. it can be hard to come by sometimes. a
    penny i have not, but a text box for your thoughts i do humbly offer.
  </p>
  <div class="py-5">
    <hr />
  </div>
  <form (ngSubmit)="submit()">
    <!-- Honeypot: hidden from humans; the API drops anything that fills it. -->
    <input
      type="text"
      name="website"
      tabindex="-1"
      autocomplete="off"
      aria-hidden="true"
      class="hidden"
      [(ngModel)]="honeypot"
    />
    <textarea
      id="feedback-box"
      name="feedback"
      rows="6"
      class="form-input"
      aria-label="your feedback"
      [(ngModel)]="text"
      (ngModelChange)="status.set('idle')"
    ></textarea>
    <div class="flex justify-end pt-3">
      <button
        type="submit"
        class="btn btn-primary"
        [disabled]="text().trim().length === 0 || status() === 'sending'"
      >
        @switch (status()) {
          @case ("sent") { thank you :) }
          @case ("failed") { try again? }
          @default { submit }
        }
      </button>
    </div>
  </form>
</main>
